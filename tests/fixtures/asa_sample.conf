hostname ASA-EDGE
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 198.51.100.2 255.255.255.248
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.1.0.1 255.255.255.0
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 10.1.50.1 255.255.255.0
!
object network WEB
 host 10.1.50.10
object network INSIDE-NET
 subnet 10.1.0.0 255.255.255.0
object-group network ADMINS
 network-object host 10.1.0.5
 network-object host 10.1.0.6
object-group service WEB-PORTS tcp
 port-object eq 80
 port-object eq https
!
access-list OUT-IN extended permit tcp any object WEB object-group WEB-PORTS
access-list OUT-IN extended permit tcp any host 10.1.50.10 eq 3389 (hitcnt=0) 0xabc
access-list OUT-IN extended deny ip any any
access-list IN-OUT extended permit tcp object-group ADMINS object WEB eq ssh
access-list IN-OUT extended permit ip object INSIDE-NET any
access-group OUT-IN in interface outside
access-group IN-OUT in interface inside
