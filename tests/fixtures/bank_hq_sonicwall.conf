# NetDrift-Auditor sample: SonicOS-style CLI export for a fictional bank HQ firewall.
# Intentional flaws:  R6 shadowed by R5 | R9 Any-to-Any (outage leftover) | R7 direct DB exposure
#                     R8 RDP from the Internet | R5 over-broad LAN->DMZ
hostname BANK-HQ-FW01

zone WAN security-type untrusted
zone LAN security-type trusted
zone DMZ security-type public
zone PCI_DB security-type trusted
zone MGMT security-type trusted

interface X1
  zone WAN
  ip 203.0.113.2 255.255.255.248
  exit
interface X0
  zone LAN
  ip 10.10.10.1 255.255.255.0
  exit
interface X2
  zone DMZ
  ip 10.10.20.1 255.255.255.0
  exit
interface X3
  zone PCI_DB
  ip 10.10.30.1 255.255.255.0
  exit
interface X4
  zone MGMT
  ip 10.10.99.1 255.255.255.0
  exit

address-object ipv4 "Users-Net" network 10.10.10.0 255.255.255.0 zone LAN
address-object ipv4 "DMZ-Net" network 10.10.20.0 255.255.255.0 zone DMZ
address-object ipv4 "Web-Srv" host 10.10.20.10 zone DMZ
address-object ipv4 "App-Srv" host 10.10.20.20 zone DMZ
address-object ipv4 "DB-Core" host 10.10.30.10 zone PCI_DB
address-object ipv4 "DB-Replica" host 10.10.30.11 zone PCI_DB
address-group ipv4 "DB-Servers"
  address-object ipv4 "DB-Core"
  address-object ipv4 "DB-Replica"
  exit
address-object ipv4 "Mgmt-Switch" host 10.10.99.2 zone MGMT
address-object ipv4 "WAN-VIP-Web" host 203.0.113.3 zone WAN

service-object "HTTP" TCP 80 80
service-object "HTTPS" TCP 443 443
service-object "SSH" TCP 22 22
service-object "RDP" TCP 3389 3389
service-object "MSSQL" TCP 1433 1433
service-group "Web-Services"
  service-object "HTTP"
  service-object "HTTPS"
  exit

access-rule ipv4 from LAN to DMZ action allow source address name "Users-Net" service name "HTTPS" destination address name "Web-Srv" comment "Users to intranet web"
access-rule ipv4 from DMZ to PCI_DB action allow source address name "App-Srv" service name "MSSQL" destination address name "DB-Servers" comment "App tier to DB"
access-rule ipv4 from WAN to DMZ action allow source address any service name "Web-Services" destination address name "Web-Srv" comment "Public web"
access-rule ipv4 from LAN to WAN action allow source address name "Users-Net" service any destination address any comment "Internet access"
access-rule ipv4 from LAN to DMZ action allow source address name "Users-Net" service any destination address name "DMZ-Net" comment "Legacy users to DMZ"
access-rule ipv4 from LAN to DMZ action deny source address name "Users-Net" service name "SSH" destination address name "App-Srv" comment "Block SSH to app tier"
access-rule ipv4 from LAN to PCI_DB action allow source address name "Users-Net" service name "MSSQL" destination address name "DB-Core" comment "DBA legacy access"
access-rule ipv4 from WAN to DMZ action allow source address any service name "RDP" destination address name "App-Srv" comment "Vendor RDP"
access-rule ipv4 from DMZ to MGMT action allow source address any service any destination address any comment "TEMP-OUTAGE-INC4471 do not remove"
access-rule ipv4 from any to any action deny source address any service any destination address any comment "Cleanup rule"

nat-policy ipv4 inbound X1 outbound X2 source original any translated original destination original "WAN-VIP-Web" translated "Web-Srv" service original "HTTPS" translated original comment "Publish web"
